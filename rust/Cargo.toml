[package]
name = "monsterft"
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
description = "Write apps that survive cosmic radiation"
autotests = false
autoexamples = false

[dependencies]
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "session", "cache"] }
tokio = { version = "=1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros", "process", "signal"] }
tokio-util = { version = "=0.7.20", features = ["codec", "rt"] }
bytes = { version = "=1.12.1", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
rmp-serde = "=1.3.1"
rmpv = { version = "=1.3.1", features = ["with-serde"] }
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }
getrandom = "=0.4.3"
rand_xoshiro = "=0.8.1"
command-fds = { version = "=0.3.3", features = ["tokio"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
iceoryx2 = "=0.10.0"

[target.'cfg(target_os = "linux")'.dependencies]
shmem-ipc = "=0.3.0"

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query"] }
sha2 = "=0.11.1"
serde_json = "=1.0.154"
tempfile = "=3.27.0"

